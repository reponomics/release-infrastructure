name: Workflow lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tentative fork adoption: update these pins and the pre-commit hook together.
env:
  ACTIONLINT_REVISION: '220b76cfa568e00ed8b3c476898f849a722b88e2'
  ACTIONLINT_VERSION: 'v1.17.1'
  GO_VERSION: '1.27.4'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  CGO_ENABLED: '0'

jobs:
  actionlint:
    name: Check workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out only workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/*
      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-reports"
          printf 'ACTIONLINT_REPORTS=%s/actionlint-reports\nACTIONLINT_BINARY=%s/actionlint\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out the pinned linter source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kjanat/actionlint
          ref: ${{ env.ACTIONLINT_REVISION }}
          fetch-depth: 1
          persist-credentials: false
          path: .actionlint-source
      - name: Set up the patched Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Build the pinned release
        working-directory: .actionlint-source
        run: |
          test "$(git rev-parse HEAD)" = "$ACTIONLINT_REVISION"
          test "$(go env GOVERSION)" = "go$GO_VERSION"
          printf 'repository=https://github.com/kjanat/actionlint\nrevision=%s\nversion=%s\ngo=%s\n' \
            "$ACTIONLINT_REVISION" "$ACTIONLINT_VERSION" "$GO_VERSION" > "$ACTIONLINT_REPORTS/provenance.txt"
          go build -mod=readonly -trimpath -o "$ACTIONLINT_BINARY" \
            -ldflags "-X actionlint.kjanat.dev.version=${ACTIONLINT_VERSION#v}" \
            ./cmd/actionlint > "$ACTIONLINT_REPORTS/build.log" 2>&1
          go version -m "$ACTIONLINT_BINARY" > "$ACTIONLINT_REPORTS/build-info.txt"
      - name: Lint workflows and report safe annotations
        # Keep the reporter here so the project checkout needs only workflow files.
        # Never print raw linter output: diagnostics can contain contributor text.
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          REPORT_LIMIT = 10 * 1024 * 1024
          ANNOTATION_LIMIT = 50

          def escape(value, *, property=False):
              value = str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if property:
                  value = value.replace(':', '%3A').replace(',', '%2C')
              return value

          def workflow_files():
              directory = Path('.github/workflows')
              files = sorted(path for path in directory.iterdir() if path.suffix in ('.yml', '.yaml'))
              if not files or any(path.is_symlink() or not path.is_file() for path in files):
                  raise ValueError('Expected regular workflow files')
              return [path.as_posix() for path in files]

          def read_findings(path, allowed):
              if path.stat().st_size > REPORT_LIMIT:
                  raise ValueError('Report exceeds annotation processing limit')
              findings = json.loads(path.read_text(encoding='utf-8'))
              if findings is None:
                  return []
              if not isinstance(findings, list):
                  raise ValueError('Expected a JSON array of findings')
              for finding in findings:
                  validate_finding(finding, allowed)
              return findings

          def validate_finding(finding, allowed):
              if not isinstance(finding, dict):
                  raise ValueError('Invalid finding object')
              if not isinstance(finding.get('filepath'), str) or finding['filepath'] not in allowed:
                  raise ValueError('Unexpected finding path')
              for key in ('line', 'column'):
                  if type(finding.get(key)) is not int or finding[key] < 1:
                      raise ValueError('Invalid finding location')
              for key in ('message', 'kind'):
                  if not isinstance(finding.get(key), str):
                      raise ValueError('Invalid finding text')

          def annotate(finding):
              properties = {
                  'file': finding['filepath'],
                  'line': finding['line'],
                  'col': finding['column'],
                  'title': 'actionlint: ' + finding['kind'],
              }
              fields = ','.join(key + '=' + escape(value, property=True) for key, value in properties.items())
              print('::error ' + fields + '::' + escape(finding['message']))

          def lint(binary, reports, files):
              command = [binary, '-no-color', '-shellcheck=', '-pyflakes=', '-format', '{{json .}}', *files]
              with (reports / 'findings.json').open('wb') as output, (reports / 'stderr.log').open('wb') as errors:
                  result = subprocess.run(command, stdout=output, stderr=errors, timeout=180, check=False)
              findings = read_findings(reports / 'findings.json', set(files))
              for finding in findings[:ANNOTATION_LIMIT]:
                  annotate(finding)
              return result.returncode, len(findings)

          def main():
              reports = Path(os.environ['ACTIONLINT_REPORTS'])
              reports.mkdir(parents=True, exist_ok=True)
              status = {'exit_code': 1, 'findings': 0, 'report_valid': False}
              try:
                  code, count = lint(os.environ['ACTIONLINT_BINARY'], reports, workflow_files())
                  status = {'exit_code': code or int(count > 0), 'findings': count, 'report_valid': True}
              except (OSError, ValueError, subprocess.TimeoutExpired):
                  print('::error::actionlint could not complete or produced an invalid report; inspect the retained reports.')
              if status['exit_code'] and not status['findings'] and status['report_valid']:
                  print('::error::actionlint failed without findings; inspect the retained stderr log.')
              (reports / 'status.json').write_text(json.dumps(status) + '\n', encoding='utf-8')
              summary = (
                  'Workflow lint: ' + ('failed' if status['exit_code'] else 'passed') + '.\n\n'
                  + str(status['findings']) + ' findings; at most ' + str(ANNOTATION_LIMIT)
                  + ' annotations displayed. Full diagnostics are retained in the actionlint-report artifact.\n'
              )
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
                  output.write(summary)

          if __name__ == '__main__':
              main()
          PY
      - name: Retain workflow lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actionlint-report
          path: ${{ runner.temp }}/actionlint-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce lint result
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads((Path(os.environ['ACTIONLINT_REPORTS']) / 'status.json').read_text())
          raise SystemExit(1 if status['exit_code'] else 0)
          PY
